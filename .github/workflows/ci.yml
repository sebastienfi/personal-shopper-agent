name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Manifests are valid JSON
        run: |
          set -euo pipefail
          for f in .claude-plugin/marketplace.json plugins/shopper-agent/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok  $f"
          done

      - name: Marketplace source path resolves
        run: |
          set -euo pipefail
          src=$(python3 -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['source'])")
          test -f "$src/.claude-plugin/plugin.json" || { echo "::error::$src has no plugin.json"; exit 1; }
          test -f "$src/skills/shopper-agent/SKILL.md" || { echo "::error::$src has no skill"; exit 1; }
          echo "ok  $src"

      - name: Versions agree
        run: |
          set -euo pipefail
          mv=$(python3 -c "import json;print(json.load(open('.claude-plugin/marketplace.json'))['plugins'][0]['version'])")
          pv=$(python3 -c "import json;print(json.load(open('plugins/shopper-agent/.claude-plugin/plugin.json'))['version'])")
          [ "$mv" = "$pv" ] || { echo "::error::marketplace $mv != plugin $pv"; exit 1; }
          echo "ok  $pv"

      # The checks above are dependency-free and catch the structural breakage.
      # This one is the CLI's own validator, which additionally rejects
      # unrecognized manifest fields that the runtime would silently tolerate.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Claude Code manifest validation (strict)
        run: |
          set -euo pipefail
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude plugin validate . --strict
          claude plugin validate ./plugins/shopper-agent --strict
